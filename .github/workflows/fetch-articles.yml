name: Fetch Tech Articles

on:
  schedule:
    - cron: '0 0 * * 0'  # 每周日午夜运行
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-and-pr:
    runs-on: ubuntu-latest
    name: Fetch Tech Articles & Create PR
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch tech articles
        run: pnpm fetch-tech-articles

      - name: Check for changes
        id: check_changes
        run: |
          git add src/content/posts/ schedule.json fetched-articles.json
          git diff --cached --quiet || true
          if git diff --cached --exit-code; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Create pull request
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: 'feat: 添加新的技术文章'
          title: '自动获取的技术文章'
          body: |
            ## 📰 自动获取的技术文章
            
            此 PR 包含从 Dev.to 和其他来源获取的最新技术文章。
            文章已按照每天 schedule.json 安排好发布计划！
          branch: auto-fetch-articles
          delete-branch: true
          labels: |
            enhancement
            content
