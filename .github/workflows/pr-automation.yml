name: PR Automation

on:
  pull_request:
    types: [opened]

jobs:
  automate-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Add labels based on files changed
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const labels = new Set();
            for (const f of files) {
              const n = f.filename;
              if (n.includes('README') || n.endsWith('.md')) labels.add('documentation');
              if (n.startsWith('src/') && (n.endsWith('.ts') || n.endsWith('.astro') || n.endsWith('.svelte'))) labels.add('code');
              if (n.endsWith('.css') || n.includes('tailwind') || n.includes('styles')) labels.add('styling');
              if (n.includes('.github/workflows')) labels.add('ci/cd');
              if (n.includes('package.json') || n.includes('pnpm-lock')) labels.add('dependencies');
            }
            if (labels.size) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, labels: [...labels],
              });
            }
